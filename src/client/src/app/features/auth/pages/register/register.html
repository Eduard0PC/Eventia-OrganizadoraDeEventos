<app-auth-layout>
  <div class="w-full max-w-md bg-gray-900 rounded-2xl shadow-xl p-8">
    
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-gray-100">
        Crear Cuenta
      </h2>

      <p class="text-gray-400 mt-2">
        Regístrate para acceder a las funcionalidades y organizar tus eventos
      </p>
    </div>

    @if (error) {
      <div class="mb-4 p-3 bg-red-950/80 border border-red-500/50 rounded-lg text-red-200 text-sm">
        {{ error }}
      </div>
    }

    @if (exito) {
      <div class="mb-4 p-3 bg-green-950/80 border border-green-500/50 rounded-lg text-green-200 text-sm">
        {{ exito }}
      </div>
    }

    <form (ngSubmit)="submit()" class="space-y-4">

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">
            Nombre *
          </label>
          <input
            type="text"
            name="nombre"
            [(ngModel)]="nombre"
            placeholder="Juan"
            required
            class="w-full px-4 py-2.5 bg-gray-800 text-white border border-gray-700 rounded-lg
            placeholder:text-gray-500
            focus:outline-none focus:ring-2 focus:ring-red-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1">
            Apellido *
          </label>
          <input
            type="text"
            name="apellido"
            [(ngModel)]="apellido"
            placeholder="Pérez"
            required
            class="w-full px-4 py-2.5 bg-gray-800 text-white border border-gray-700 rounded-lg
            placeholder:text-gray-500
            focus:outline-none focus:ring-2 focus:ring-red-500"
          />
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">
          Teléfono
        </label>
        <input
          type="tel"
          name="telefono"
          [(ngModel)]="telefono"
          placeholder="9991234567"
          class="w-full px-4 py-2.5 bg-gray-800 text-white border border-gray-700 rounded-lg
          placeholder:text-gray-500
          focus:outline-none focus:ring-2 focus:ring-red-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">
          Correo electrónico *
        </label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="correo@ejemplo.com"
          required
          class="w-full px-4 py-2.5 bg-gray-800 text-white border border-gray-700 rounded-lg
          placeholder:text-gray-500
          focus:outline-none focus:ring-2 focus:ring-red-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">
          Contraseña *
        </label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="********"
          required
          class="w-full px-4 py-2.5 bg-gray-800 text-white border border-gray-700 rounded-lg
          placeholder:text-gray-500
          focus:outline-none focus:ring-2 focus:ring-red-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">
          Confirmar contraseña *
        </label>
        <input
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="********"
          required
          class="w-full px-4 py-2.5 bg-gray-800 text-white border border-gray-700 rounded-lg
          placeholder:text-gray-500
          focus:outline-none focus:ring-2 focus:ring-red-500"
        />
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-red-600 hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-lg transition mt-2 flex items-center justify-center gap-2"
      >
        @if (loading) {
          <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Registrando...
        } @else {
          Registrarme
        }
      </button>

    </form>

    <div class="mt-4 text-center">
      <span class="text-gray-400">
        ¿Ya tienes cuenta?
      </span>

      <a
        routerLink="/login"
        class="text-amber-500 hover:text-amber-400 font-semibold ml-1 transition"
      >
        Iniciar sesión
      </a>
    </div>

  </div>
</app-auth-layout>
