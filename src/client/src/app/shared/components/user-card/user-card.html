<div class="p-4 m-4 rounded-2xl bg-gray-800/60 border border-gray-700/60 flex items-center justify-between shadow-xs">
  <div class="flex items-center gap-3 overflow-hidden">
    <div class="w-10 h-10 shrink-0 rounded-full bg-linear-to-tr from-red-700 to-red-500 text-white font-bold flex items-center justify-center text-sm border border-red-500/30 shadow-xs">
      {{ userName.charAt(0).toUpperCase() }}
    </div>
    <div class="truncate">
      <p class="text-sm font-semibold text-white truncate" [title]="userName">{{ userName }}</p>
      <p class="text-xs text-gray-400 truncate" [title]="userRole">{{ userRole }}</p>
    </div>
  </div>
  @if (showLogout) {
    <button
      (click)="logout()"
      title="Cerrar sesión"
      class="text-gray-400 hover:text-red-400 p-2 rounded-lg hover:bg-gray-700/60 transition cursor-pointer"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
    </button>
  }
</div>
